name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install ruff==0.15.7

      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GROQ_API_KEY: test-groq-key
      NEWS_API_KEY: test-news-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - run: pip install -r requirements-dev.txt

      - run: pytest -q --timeout=60

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t financial-ai .